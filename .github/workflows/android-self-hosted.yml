name: Android self-hosted CI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-self-hosted.yml
      - android/**
      - heycyan-core/**
      - tools/hil/**
      - .gitmodules
      - README.md

permissions:
  contents: read
  packages: read

concurrency:
  group: android-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, unit, and emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        env:
          # The Android build no longer requires Moonshine/LFS assets. Keep automatic
          # smudging disabled so unrelated LFS content cannot slow persistent runners.
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          submodules: recursive
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Tasker integration contracts
        run: python3 tools/hil/validate_tasker_profiles.py

      - name: Run Android and shared tests
        working-directory: android/CyanBridge
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          :shared:portabilityTest

      - name: Assemble debug and instrumentation APKs
        working-directory: android/CyanBridge
        run: >-
          ./gradlew --no-daemon --stacktrace
          -PtestAbi=x86_64
          :app:assembleDebug
          :app:assembleDebugAndroidTest
