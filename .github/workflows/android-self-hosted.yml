name: Android self-hosted CI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-self-hosted.yml
      - android/**
      - heycyan-core/**
      - tools/hil/**
      - .gitmodules
      - README.md

permissions:
  contents: read
  packages: read

concurrency:
  group: android-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, unit, and emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        env:
          # The Android build no longer requires Moonshine/LFS assets. Keep automatic
          # smudging disabled so unrelated LFS content cannot slow persistent runners.
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          submodules: recursive
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -eu
          sdk_root="$HOME/android-sdk"
          cmdline_tools_archive="$RUNNER_TEMP/commandlinetools-linux-11076708_latest.zip"

          mkdir -p "$sdk_root/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O "$cmdline_tools_archive"
          unzip -q "$cmdline_tools_archive" -d "$RUNNER_TEMP/android-commandlinetools"
          mkdir -p "$sdk_root/cmdline-tools/latest"
          mv "$RUNNER_TEMP/android-commandlinetools/cmdline-tools/"* "$sdk_root/cmdline-tools/latest/"

          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
          } >> "$GITHUB_ENV"
          {
            echo "$sdk_root/cmdline-tools/latest/bin"
            echo "$sdk_root/platform-tools"
          } >> "$GITHUB_PATH"
          export ANDROID_HOME="$sdk_root"
          export ANDROID_SDK_ROOT="$sdk_root"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$sdk_root/platform-tools:$PATH"

          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Tasker integration contracts
        run: python3 tools/hil/validate_tasker_profiles.py

      - name: Run Android and shared tests
        working-directory: android/CyanBridge
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          :shared:portabilityTest

      - name: Assemble debug and instrumentation APKs
        working-directory: android/CyanBridge
        run: >-
          ./gradlew --no-daemon --stacktrace
          -PtestAbi=x86_64
          :app:assembleDebug
          :app:assembleDebugAndroidTest
